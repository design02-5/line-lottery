<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e0b1f">
  <title>幸運抽獎</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">
  <!-- 更新 style.css / app.js 時，把 v= 的數字加 1，手機才會抓新檔（GitHub Pages 會快取 10 分鐘） -->
  <link rel="stylesheet" href="style.css?v=5">
</head>
<body>
  <div class="backdrop" id="backdrop" aria-hidden="true" hidden></div>
  <div class="sky" aria-hidden="true"></div>

  <div id="app">
    <header class="hero">
      <img class="logo" id="logo" alt="" hidden>
      <div class="eyebrow">LUCKY DRAW</div>
      <h1 id="title">&nbsp;</h1>
      <p class="greet" id="greet"></p>
    </header>

    <main id="stage" class="stage"></main>

    <section class="info" id="info" hidden>
      <h2>獎項一覽</h2>
      <ul class="prize-list" id="prizeList"></ul>
      <h2>活動說明</h2>
      <div class="desc" id="desc"></div>
    </section>
  </div>

  <div class="loading" id="loading">
    <div class="spinner"></div>
    <p id="loadingText">載入中…</p>
  </div>

  <div class="modal" id="modal" hidden>
    <div class="rays" id="rays"></div>
    <div class="modal-card" id="modalCard">
      <img class="m-img" id="mImg" alt="" hidden>
      <div class="m-eyebrow" id="mEyebrow"></div>
      <div class="m-prize" id="mPrize"></div>
      <p class="m-text" id="mText"></p>
      <a class="btn" id="mLink" target="_blank" rel="noopener" hidden></a>
      <button class="btn ghost" id="mClose">完成</button>
    </div>
  </div>

  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.9.3/dist/confetti.browser.min.js"></script>
  <script src="app.js?v=5"></script>
</body>
</html>
